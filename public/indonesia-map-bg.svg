    <path d="M290,370 Q340,360 400,365 Q460,370 520,375 Q550,380 570,382 Q560,395 500,392 Q430,388 370,385 Q310,385 285,380 Z" />
    <ellipse cx="585" cy="384" rx="10" ry="7" /> <!-- Bali -->
