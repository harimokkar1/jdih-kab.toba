    <path d="M635,385 Q660,382 680,387 Q665,392 638,390 Z" /> <!-- Sumbawa -->
    <path d="M695,386 Q725,384 745,390 Q725,395 698,392 Z" /> <!-- Flores -->
    <ellipse cx="765" cy="392" rx="18" ry="6" /> <!-- Timor Barat -->

