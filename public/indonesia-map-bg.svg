    <ellipse cx="230" cy="220" rx="14" ry="7" transform="rotate(-25 230 220)" />
    <ellipse cx="270" cy="280" rx="12" ry="6" transform="rotate(-15 270 280)" />
    <ellipse cx="305" cy="305" rx="10" ry="5" />
    
